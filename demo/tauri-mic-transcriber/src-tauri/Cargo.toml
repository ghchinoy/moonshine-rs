[package]
name = "tauri-mic-transcriber"
version = "0.1.0"
description = "Minimal Tauri v2 + Lit demo application for Moonshine Voice STT"
authors = ["G. H. Chinoy <ghchinoy@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
moonshine-rs = { path = "../../../crates/moonshine-rs", features = ["serde"] }
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
