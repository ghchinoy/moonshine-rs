[package]
name = "moonshine-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Idiomatic Rust wrapper for Moonshine Voice speech-to-text"
repository.workspace = true
readme = "README.md"
keywords = ["stt", "speech-to-text", "moonshine", "audio", "onnx"]
categories = ["multimedia::audio", "api-bindings"]

[dependencies]
moonshine-sys = { path = "../moonshine-sys", version = "0.2.1" }
thiserror = "1.0"
ureq = "2.12"
serde_json = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"], optional = true }
symphonia = { version = "0.5", features = ["all-formats", "all-codecs"], optional = true }
rubato = { version = "0.16", optional = true }

[dev-dependencies]
hound = "3.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "transcribe_file"
path = "examples/transcribe_file.rs"

[[example]]
name = "download_model"
path = "examples/download_model.rs"

[[example]]
name = "word_timestamps"
path = "examples/word_timestamps.rs"

[[example]]
name = "speaker_diarization"
path = "examples/speaker_diarization.rs"

[[example]]
name = "async_transcribe"
path = "examples/async_transcribe.rs"

[[example]]
name = "browse_catalog"
path = "examples/browse_catalog.rs"

[[example]]
name = "stream_transcribe"
path = "examples/stream_transcribe.rs"

[features]
default = ["audio"]
audio = ["dep:symphonia", "dep:rubato"]
serde = ["dep:serde"]
